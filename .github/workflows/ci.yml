name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Commit Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          sudo apt-get install -y jq
          DIFF=$(git diff HEAD^ HEAD)
          
          RESPONSE=$(curl -s https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"llama3-70b-8192\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"Ты строгий судья. Оцени код кратко и по существу. Если есть ошибки — указывай прямо.\"},
                {\"role\": \"user\", \"content\": \"Оцени diff: $DIFF\"}
              ]
            }")

          REVIEW=$(echo $RESPONSE | jq -r '.choices[0].message.content // ("ERROR: " + (.error.message // "unknown"))')
          
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$REVIEW\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
