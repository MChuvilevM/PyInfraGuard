name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio pydantic aiohttp prometheus-client

      - name: Run Ruff (Check & Fix)
        run: |
          ruff check . --fix
          
      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: apply ruff auto-fixes"
          skip_fetch: true

      - name: Run Tests
        id: run_tests
        run: pytest

      - name: Report Status
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" == "success" ]; then
            echo "✅ Tests passed successfully"
          else
            echo "❌ Tests failed"
            exit 1
          fi
