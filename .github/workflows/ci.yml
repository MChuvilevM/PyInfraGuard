name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff mypy pytest pytest-asyncio pydantic aiohttp

      # Авто-фикс всего, на что ругается Ruff
      - name: Run Ruff Auto-fix
        run: |
          ruff check . --fix
          ruff format .

      # Коммитим правки, если они были
      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix style and imports"

      - name: Run Mypy
        run: mypy .

      - name: Run Pytest
        run: pytest
