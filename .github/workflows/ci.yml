name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Устанавливаем всё, что импортируется в проекте
          pip install ruff mypy pytest pytest-asyncio pydantic aiohttp prometheus-client

      - name: Run Ruff (Check and Format)
        run: |
          ruff check . --fix
          ruff format .

      - name: Run Mypy
        run: mypy .

      - name: Run Pytest
        run: pytest
