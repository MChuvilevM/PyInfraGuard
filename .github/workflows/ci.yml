name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio pydantic aiohttp prometheus-client

      - name: Run Ruff (Check & Fix)
        run: |
          ruff check . --fix
          
      - name: AI Commit Review
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sudo apt-get install -y jq
          DIFF=$(git diff HEAD^ HEAD)
          if [ -z "$DIFF" ]; then exit 0; fi

          # Делаем запрос и сохраняем ответ в файл
          RESPONSE=$(curl -s -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"contents\": [{\"parts\": [{\"text\": \"Ты строгий судья-разработчик. Проанализируй этот diff: ${DIFF//\"/\\\"}\"}]}]}" \
            -o response.json)
          
          # Логируем ответ для отладки
          echo "HTTP Status: $RESPONSE"
          cat response.json

          # Извлекаем текст
          REVIEW=$(jq -r '.candidates[0].content.parts[0].text // empty' response.json)
          
          if [ -z "$REVIEW" ]; then
            REVIEW="Ошибка: API не вернул текст. Проверь логи Actions (HTTP Status: $RESPONSE)."
          fi
          
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$REVIEW\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
