name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio pydantic aiohttp prometheus-client

      - name: Run Ruff (Check & Fix)
        run: |
          ruff check . --fix
          
      - name: AI Commit Review
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          sudo apt-get install -y jq
          # Сохраняем diff во временный файл
          git diff HEAD^ HEAD > diff.txt
          
          # Формируем JSON с помощью jq, он сам позаботится об экранировании
          jq -n --rawfile diff diff.txt \
            '{contents: [{parts: [{text: ("Ты строгий судья-разработчик. Проанализируй этот diff: " + $diff)}]}]}' \
            > request.json

          # Отправляем файл
          RESPONSE_CODE=$(curl -s -o response.json -w "%{http_code}" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json)

          if [ "$RESPONSE_CODE" != "200" ]; then
            echo "HTTP Error: $RESPONSE_CODE"
            cat response.json
            exit 1
          fi

          REVIEW=$(jq -r '.candidates[0].content.parts[0].text' response.json)
          
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$REVIEW\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
