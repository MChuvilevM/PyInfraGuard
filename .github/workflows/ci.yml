name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pydantic aiohttp aiogram prometheus-client

      - name: Run Ruff Check (Lint)
        run: ruff check src tests --fix

      - name: Run Ruff Format
        run: ruff format src tests --check

      - name: Run Mypy Static Type Analysis
        run: mypy src tests

      - name: Run Pytest
        run: pytest
