name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pydantic aiohttp prometheus-client

      # 1. Сначала исправляем всё, что можно исправить автоматически
      - name: Auto-fix formatting
        run: |
          ruff check src tests --fix
          ruff format src tests

      # 2. Коммитим исправления, если они есть
      - name: Commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-fix linting and formatting issues"
          file_pattern: "*.py"

      # 3. После авто-фикса запускаем статический анализ и тесты
      - name: Run Mypy Static Type Analysis
        run: mypy src tests

      - name: Run Pytest
        run: pytest
