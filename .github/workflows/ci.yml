name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ruff pytest pytest-asyncio pydantic aiohttp prometheus-client

      - name: Run Ruff (Check & Fix)
        run: |
          ruff check . --fix
          
      - name: AI Commit Review
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Получаем список измененных файлов и сам diff
          DIFF=$(git diff HEAD^ HEAD)
          
          # Отправляем в API и получаем комментарий
          REVIEW=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "gpt-4",
              "messages": [{"role": "system", "content": "Ты строгий судья-разработчик. Проанализируй этот diff и напиши краткий, жесткий вердикт о качестве изменений."}, {"role": "user", "content": "'"$DIFF"'"}]
            }' | jq -r '.choices[0].message.content')

          # Отправляем комментарий к последнему коммиту
          curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$REVIEW\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
