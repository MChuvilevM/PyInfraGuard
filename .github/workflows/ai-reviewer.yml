name: AI Commit Review

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Commit Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_GEMINI: ${{ secrets.API_GEMINI }}
        run: |
          # Получаем дифф последнего коммита
          DIFF=$(git diff HEAD~1 HEAD)
          
          PAYLOAD=$(jq -n \
            --arg diff "$DIFF" \
            --arg sys "Анализируй код. Кратко: ошибки и исправления. Если чисто — 'Код чист'." \
            '{contents: [{role: "user", parts: [{text: ($sys + "\n" + $diff)}]}]}')

          RESPONSE=$(curl -s -v "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$API_GEMINI" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          REVIEW=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "ERROR: Gemini API failure"')
          
          BODY=$(jq -n --arg msg "$REVIEW" '{body: $msg}')

          curl -L -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments"
