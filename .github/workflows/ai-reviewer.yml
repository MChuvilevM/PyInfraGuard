name: AI Reviewer
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]

jobs:
  ai-handler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install httpx PyGithub
      - name: Run Reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVENT_DATA: ${{ toJson(github.event) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/reviewer.py
